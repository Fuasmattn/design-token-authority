packages:
  - 'packages/*'
  - 'site'

onlyBuiltDependencies:
  - esbuild

# Security fixes for transitive dependencies (TICKET-140). Each raises a package to the first
# version without the advisory, inside the major its dependents ask for. Drop an entry once the
# packages that pull it in require the fixed version themselves.
overrides:
  qs@<6.16.1: ^6.16.1 # style-dictionary (shipped)
  undici@>=7 <7.30.1: ^7.30.1 # release-it
  defu@<6.1.7: ^6.1.7 # release-it
  basic-ftp@<5.3.1: ^5.3.1 # release-it proxy-agent
  ip-address@<10.7.4: ^10.7.4 # release-it proxy-agent
  picomatch@<2.3.2: ^2.3.2 # site build
  source-map-js@<1.2.2: ^1.2.2 # coverage
  postcss-selector-parser@<7.1.7: ^7.1.7 # site build
  fast-uri@<3.1.9: ^3.1.9 # ajv
  '@bundled-es-modules/glob>glob': ^14.0.2 # style-dictionary (shipped), brings minimatch 11 (TICKET-177)

auditConfig:
  ignoreGhsas:
    # basic-ftp Client.list() CPU DoS from a malicious FTP server. Only reached when release-it
    # loads a PAC proxy file over ftp://, which the Release workflow never configures; get-uri
    # (release-it > proxy-agent) still requires basic-ftp 5. Drop once release-it moves on.
    - GHSA-c475-qrg2-pj4r
    # deepmerge 4.2–4.3.1 (style-dictionary > @bundled-es-modules/deepmerge): a "__proto__" key in a
    # merged object sets the prototype of the result. No fixed version exists. Style Dictionary merges
    # its config, its hooks and, through its options, DTA's token tree; DTA leaves out every
    # "__proto__" key when it reads a token or resolver file (reserved-key, TICKET-175), so token
    # data cannot carry one.
    # Drop once deepmerge or style-dictionary ship a fix.
    - GHSA-gcqx-w48m-w2h4
