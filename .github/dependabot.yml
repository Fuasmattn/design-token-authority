version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # DTA runs on Node.js 24 (.nvmrc, engines): its types follow that major, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
