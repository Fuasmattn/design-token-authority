# Releases design-token-authority and create-dta to npm, with provenance (TICKET-090).
# Run by hand from main (Actions → Release → Run workflow). Both packages are published before
# the release commit and tag are pushed, so a failed publish leaves nothing behind to clean up.
# Publishes with npm trusted publishing (OIDC, TICKET-141): no npm token. Both packages trust this
# workflow file of this repository on npmjs.com (Settings → Trusted publisher, with `npm publish`
# allowed); npm adds provenance itself. A protected main must let github-actions push the release
# commit and tag.
name: Release
on:
  workflow_dispatch:
    inputs:
      increment:
        # No default: a version on npm cannot be published twice. The first release is major
        # (2.0.0): v1.0.0 is the tag of the v1 tool.
        description: 'patch, minor, major, or an exact version (the first release: major)'
        required: true
        type: string
permissions:
  contents: write # the release commit, the tag and the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog reads the history since the last tag
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer; pnpm packs, npm publishes (.release-it.json).
      - run: npm install --global npm@^11.5.1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: pnpm release ${{ inputs.increment }} --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
