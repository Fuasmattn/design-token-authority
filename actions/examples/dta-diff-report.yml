# 2/3 · Reports the run on its pull request: publish hook (optional), status check, comment.
# Runs trusted code from the default branch and may use secrets; it only reads the report.
# Generated by `dta init --diff`; run it again to update this file.
name: dta diff report
on:
  workflow_run:
    workflows: [dta diff]
    types: [completed]
permissions:
  actions: read # download the report artifact
  pull-requests: write # the sticky comment, removing a stale approval label
  statuses: write # the "dta diff" status check
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # the default branch: your config and publish script
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: Fuasmattn/design-token-authority/actions/diff-report@main
        with:
          # Optional: one of the recipes in "dta diff in pull requests". Publish only reports
          # of branches in this repository: a fork's report is untrusted HTML.
          publish: ${{ github.event.workflow_run.head_repository.full_name == github.repository && 'sh .github/dta-diff-publish.sh' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
